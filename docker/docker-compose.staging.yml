version: '3.8'

services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}:staging-${GITHUB_SHA}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nextgen-frontend
      - nextgen-backend

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}-api:staging-${GITHUB_SHA}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nextgen-backend

  postgres:
    image: postgres:16
    env_file: .env.staging
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nextgen-backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nextgen-backend

volumes:
  pgdata:

networks:
  nextgen-frontend:
    driver: overlay
    attachable: true
  nextgen-backend:
    driver: overlay
    attachable: true