name: NextGen CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  NX_CLOUD_DISTRIBUTED_EXECUTION: true
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: nextgen-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: marketplace_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run unit tests
      run: pnpm test:auth

    - name: Run integration tests
      run: pnpm test:orders
      env:
        SHAPARAK_API_KEY: ${{ secrets.SHAPARAK_API_KEY }}

    - name: Run load tests
      uses: grafana/k6-action@v0.3.0
      with:
        filename: ./scripts/load-test.k6.js
        duration: 3m
        vus: 50

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push auth service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/auth/Dockerfile
        tags: ghcr.io/${{ github.repository }}/auth:latest
        push: true

    - name: Build and push catalog service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/catalog/Dockerfile
        tags: ghcr.io/${{ github.repository }}/catalog:latest
        push: true

    - name: Build and push orders service
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./apps/orders/Dockerfile
        tags: ghcr.io/${{ github.repository }}/orders:latest
        push: true

  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-affected.outputs.matrix }}
      cache-key: ${{ steps.get-cache-key.outputs.key }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install pnpm (deterministic)
      uses: pnpm/action-setup@v4
      with:
        version: 8.14.0

    - name: Generate cache key
      id: get-cache-key
      run: |
        echo "key=pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml','**/package.json') }}-node${{ matrix.node || '20' }}-sha-${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Get affected projects
      id: get-affected
      run: |
        npx nx show projects --affected --base=main > affected-projects.txt
        echo "matrix=$(jq -R -s -c 'split("\n") | map(select(. != ""))' affected-projects.txt)" >> $GITHUB_OUTPUT

  lint:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        projects: ${{ fromJSON(needs.setup.outputs.matrix) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextgen_marketplace_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
          .nx/cache
        key: ${{ needs.setup.outputs.cache-key }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

    - name: Run lint
      run: pnpm nx run-many --target=lint --projects=${{ matrix.projects }} --parallel=4

  unit-tests:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextgen_marketplace_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
          .nx/cache
        key: ${{ needs.setup.outputs.cache-key }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests with retries, collect junit & coverage
      id: run-tests
      env:
        JEST_JUNIT_OUTPUT: reports/junit-${{ matrix.project }}.xml
        JEST_JUNIT_CLASSNAME: ${{ matrix.project }}
        PROJECT: ${{ matrix.project }}
      run: |
        set -euo pipefail
        mkdir -p reports coverage/${PROJECT}

        ATTEMPTS=3
        ATTEMPT=0
        EXIT_CODE=0

        while [ $ATTEMPT -lt $ATTEMPTS ]; do
          ATTEMPT=$((ATTEMPT + 1))
          echo "Running tests for $PROJECT (attempt $ATTEMPT/$ATTEMPTS)"

          pnpm nx test "$PROJECT" -- --ci --coverage --coverageDirectory=coverage/${PROJECT} --reporters=default --reporters=jest-junit || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "Tests passed on attempt $ATTEMPT"
            if [ $ATTEMPT -gt 1 ]; then
              echo "Flaky test detected for $PROJECT (passed after $ATTEMPT attempts)" > reports/FLAKY-${PROJECT}.md
            fi
            break
          else
            echo "Tests failed on attempt $ATTEMPT (exit $EXIT_CODE)"
            if [ $ATTEMPT -lt $ATTEMPTS ]; then
              echo "Retrying $PROJECT..."
              EXIT_CODE=0
            fi
          fi
        done

        if [ -n "${EXIT_CODE-}" ] && [ "$EXIT_CODE" -ne 0 ]; then
          echo "Tests for $PROJECT failed after $ATTEMPTS attempts"
          exit $EXIT_CODE
        fi

    - name: Upload junit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-${{ matrix.project }}
        path: reports/junit-${{ matrix.project }}.xml
        retention-days: 30

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.project }}
        path: coverage/${{ matrix.project }}
        retention-days: 30

    - name: Upload flaky marker
      if: always() && steps.run-tests.outputs != ''
      uses: actions/upload-artifact@v4
      with:
        name: flaky-${{ matrix.project }}
        path: reports/FLAKY-${{ matrix.project }}.md
        retention-days: 90

    - name: Conditional Codecov Upload
      if: secrets.CODECOV_TOKEN
      uses: codecov/codecov-action@v4
      with:
        files: coverage/**/lcov.info
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-report-aggregate:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
    - name: Download test artifacts
      uses: actions/download-artifact@v4
      with:
        name: junit-*
        path: reports-aggregate

    - name: Merge JUnit files
      run: |
        mkdir -p merged
        python - <<'PY'
import glob,xml.etree.ElementTree as ET
root = ET.Element('testsuites')
for f in glob.glob('reports-aggregate/junit-*.xml'):
    try:
        tree = ET.parse(f)
        for ts in tree.getroot():
            root.append(ts)
    except Exception as e:
        print('failed to merge', f, e)
ET.ElementTree(root).write('merged/junit.xml', encoding='utf-8')
PY

    - name: Upload merged junit
      uses: actions/upload-artifact@v4
      with:
        name: junit-merged
        path: merged/junit.xml
        retention-days: 30

  security:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Container Scanning
      uses: aquasecurity/trivy-action@0.13.0
      with:
        image-ref: ghcr.io/${{ github.repository }}
        format: 'sarif'
        output: trivy-results.sarif

    - name: Upload SARIF
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif

  build:
    needs: [lint, test-report-aggregate, security]
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      docker-image: ${{ steps.build-and-push.outputs.image }}
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      id: build-and-push
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Save image metadata
      run: echo "IMAGE_TAG=staging-${{ github.sha }}" >> $GITHUB_ENV

    - name: Upload image metadata
      uses: actions/upload-artifact@v4
      with:
        name: image-metadata
        path: $GITHUB_ENV
        retention-days: 90

  deploy-staging:
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to staging
      uses: docker/compose-cli@v2
      with:
        compose-file: docker-compose.staging.yml
        env-file: .env.staging
        action: up
        detach: true

    - name: Integration tests
      run: pnpm nx run-many --target=e2e --projects=api-e2e,web-e2e

  deploy-prod:
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4

    - name: Blue-green deployment
      run: |
        docker swarm init
        docker stack deploy --compose-file docker-compose.prod.yml nextgen-prod-${{ github.run_id }}
        
        # Health check with 2 minute timeout
        timeout 120s bash -c "while [[ $(docker service inspect --format '{{.UpdateStatus.State}}' nextgen-prod-${{ github.run_id }}_web) != \"completed\" ]]; do sleep 5; done"
        
        # Traffic switch and cleanup
        docker service update --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }} nextgen-prod
        docker stack rm nextgen-prod-${{ github.run_id }}

    - name: Rollback on failure
      if: failure()
      run: |
        docker service rollback nextgen-prod
        exit 1
        version: 8.15.0

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run linting
      run: pnpm lint

    - name: Run type checking
      run: pnpm nx run-many --target=typecheck --all

    - name: Run tests
      run: pnpm test
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextgen_marketplace_test
        REDIS_URL: redis://localhost:6379

    - name: Build applications
      run: pnpm build

  rust-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          services/catalog/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build catalog service
      working-directory: ./services/catalog
      run: cargo build --release

    - name: Test catalog service
      working-directory: ./services/catalog
      run: cargo test

  python-services:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install ML service dependencies
      working-directory: ./apps/ml
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test ML service
      working-directory: ./apps/ml
      run: python -m pytest tests/ --verbose

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'

  webhook-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: ${{ needs.setup.outputs.cache-key }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run webhook unit tests (with junit)
      env:
        JEST_JUNIT_OUTPUT: reports/webhook-junit.xml
      run: |
        mkdir -p reports
        pnpm run test:webhook -- --ci --reporters=default --reporters=jest-junit || EXIT_CODE=$?
        if [ "${EXIT_CODE-}" ]; then exit $EXIT_CODE; fi

    - name: Upload webhook junit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: webhook-junit
        path: reports/webhook-junit.xml
        retention-days: 30

    - name: Upload webhook coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: webhook-coverage
        path: coverage/
        retention-days: 30

  integration-tests:
    runs-on: ubuntu-latest
    services: {}
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.pnpm-store
          node_modules
        key: ${{ needs.setup.outputs.cache-key }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run integration tests (auth)
      env:
        NODE_ENV: test
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      run: |
        pnpm run test:integration -- --ci --reporters=default --reporters=jest-junit || EXIT_CODE=$?
        if [ "${EXIT_CODE-}" ]; then exit $EXIT_CODE; fi

    - name: Upload integration junit
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-junit
        path: junit.xml
        retention-days: 30

    - name: Upload integration coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-coverage
        path: coverage/
        retention-days: 30