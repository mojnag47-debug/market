version: '3.8'

services:
  # Database Services
  postgres:
    image: postgres:16-alpine
    container_name: nextgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextgen_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nextgen-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Qdrant Vector Database for ML embeddings
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: nextgen-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: nextgen-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Auth Service (NestJS)
  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
    container_name: nextgen-auth
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/nextgen_marketplace
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRE_TIME=24h
      - REDIS_URL=redis://:redis123@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Catalog Service (Rust Axum)
  catalog-service:
    build:
      context: .
      dockerfile: ./apps/catalog/Dockerfile
    container_name: nextgen-catalog
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - RUST_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/nextgen_marketplace
      - REDIS_URL=redis://:redis123@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Orders Service (NestJS)
  orders-service:
    build:
      context: .
      dockerfile: ./apps/orders/Dockerfile
    container_name: nextgen-orders
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/nextgen_marketplace
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - REDIS_URL=redis://:redis123@redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ML Service (FastAPI)
  ml-service:
    build:
      context: .
      dockerfile: ./apps/ml/Dockerfile
    container_name: nextgen-ml
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - PYTHONPATH=/app
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/nextgen_marketplace
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://:redis123@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: nextgen-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_AUTH_URL=http://localhost:3001
      - NEXT_PUBLIC_CATALOG_URL=http://localhost:3002
      - NEXT_PUBLIC_ORDERS_URL=http://localhost:3003
      - NEXT_PUBLIC_ML_URL=http://localhost:3004
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - nextgen-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  minio_data:
    driver: local

networks:
  nextgen-network:
    driver: bridge